<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>XAZX校歌 司凤版</title>
<style>
:root{--blue:#00aeec;--blue2:#00a1d6;--ink:#18191c;--muted:#9499a3;--line:#e7e9eb;--bg:#f1f2f3;--card:#fff;--shadow:0 2px 10px #0000000d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
.topbar{height:64px;background:#fff;display:flex;align-items:center;gap:26px;padding:0 max(24px,calc((100vw - 1440px)/2));box-shadow:0 1px 4px #00000012;position:sticky;top:0;z-index:20}
.logo{font-size:27px;font-weight:900;color:var(--blue);letter-spacing:-2px;white-space:nowrap}
.nav{display:flex;gap:18px;white-space:nowrap}
.nav a{color:#333;text-decoration:none}
.nav a:hover{color:var(--blue)}
.search{margin-left:auto;display:flex;width:min(360px,30vw);height:40px;background:#f1f2f3;border:1px solid #e3e5e7;border-radius:9px;overflow:hidden}
.search input{min-width:0;flex:1;border:0;background:transparent;padding:0 14px;outline:none}
.search button{width:44px;font-size:19px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffb3c7,#8ad9f5);display:grid;place-items:center;font-size:18px}
.top-action{white-space:nowrap;color:#555}
.upload{background:#fb7299;color:white;border-radius:8px;padding:9px 19px;font-weight:600}
.layout{max-width:1440px;margin:24px auto;padding:0 22px;display:grid;grid-template-columns:minmax(0,2.05fr) minmax(290px,.95fr);gap:26px}
.main,.sidebar{min-width:0}
.video-title{font-size:23px;font-weight:600;margin:0 0 10px}
.meta{display:flex;gap:18px;color:var(--muted);font-size:13px;margin-bottom:20px;flex-wrap:wrap}
.player{background:#000;position:relative;aspect-ratio:16/9;overflow:hidden;box-shadow:var(--shadow);border-radius:2px;display:flex;align-items:center;justify-content:center}
.player video{width:100%;height:100%;object-fit:contain;background:#000}
.player:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
.player:fullscreen video{height:100%;width:100%}
.poster-layer{position:absolute;inset:0;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer}
.poster-layer.hidden{display:none}
.poster-layer:after{content:"▶";width:74px;height:74px;border-radius:50%;background:#0008;color:white;display:grid;place-items:center;font-size:34px;padding-left:5px;border:2px solid #ffffffaa}
.danmaku-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.danmaku{position:absolute;white-space:nowrap;color:white;font-size:clamp(16px,2vw,26px);font-weight:700;text-shadow:1px 1px 3px #000,-1px -1px 3px #000;animation:fly 8s linear forwards}
.danmaku.top{left:50%;transform:translateX(-50%);animation:none}
.danmaku.bottom{left:50%;top:auto!important;bottom:15%;transform:translateX(-50%);animation:none}
@keyframes fly{from{left:100%}to{left:-100%}}
.controls{position:absolute;bottom:0;left:0;right:0;padding:22px 14px 10px;background:linear-gradient(transparent,#000b);color:white;opacity:1;transition:opacity .2s}
.player.hide-controls .controls{opacity:0}
.progress-wrap{height:14px;display:flex;align-items:center;cursor:pointer;margin-bottom:7px}
.progress{height:3px;background:#ffffff65;width:100%;position:relative;border-radius:5px}
.progress-fill{height:100%;width:0;background:var(--blue);border-radius:5px;position:relative}
.progress-fill:after{content:"";position:absolute;right:-5px;top:-3px;width:9px;height:9px;border-radius:50%;background:white}
.control-row{display:flex;align-items:center;gap:13px}
.ctrl{font-size:18px;color:#fff;padding:2px}
.time{font-size:12px;color:#eee;font-variant-numeric:tabular-nums}
.control-spacer{flex:1}
.volume{width:75px;accent-color:var(--blue)}
.speed{color:#fff;background:#ffffff20;border-radius:4px;padding:3px 6px;font-size:12px}
.below-player{background:#fff;padding:12px 14px;display:flex;align-items:center;gap:16px;color:#656b73;box-shadow:var(--shadow)}
.below-player .watch{margin-right:auto}
.action{display:flex;align-items:center;gap:6px;font-size:15px;color:#62676f;padding:5px 3px}
.action strong{font-weight:500}
.action.active{color:var(--blue)}
.action:hover{color:var(--blue)}
.section{background:#fff;margin-top:14px;padding:18px 20px;box-shadow:var(--shadow)}
.section h3{margin:0 0 12px;font-size:17px}
.author-line{display:flex;align-items:center;gap:12px}
.author-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ffc2d4,#a8dfff);display:grid;place-items:center;font-size:22px}
.author-info{flex:1}
.author-name{font-weight:600}
.sub{color:var(--muted);font-size:12px}
.follow{background:var(--blue);color:white;padding:7px 20px;border-radius:7px}
.desc{color:#555;white-space:pre-line;margin-top:14px}
.tag{display:inline-block;color:#00a1d6;background:#eaf8fd;padding:3px 8px;border-radius:4px;margin:12px 6px 0 0;font-size:12px}
.sidebar-head{font-size:16px;font-weight:600;margin:3px 0 14px}
.side-author{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.side-author .follow{flex:1}
.playlist-head{background:#f0f1f2;padding:12px 14px;border-radius:8px;font-weight:600;margin-bottom:14px}
.video-list{display:flex;flex-direction:column;gap:13px}
.video-card{display:grid;grid-template-columns:145px minmax(0,1fr);gap:10px;cursor:pointer;padding:5px;border-radius:7px}
.video-card:hover,.video-card.selected{background:#f1f2f3}
.thumb{position:relative;aspect-ratio:16/9;background:#dcecf5 center/cover;border-radius:6px;overflow:hidden}
.duration{position:absolute;bottom:5px;right:6px;color:white;background:#0009;padding:1px 4px;border-radius:3px;font-size:11px}
.vtitle{font-size:14px;line-height:1.45;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{font-size:12px;color:var(--muted);margin-top:7px}
.comments{margin-top:14px}
.comment-input{display:flex;gap:10px}
.comment-input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:10px 12px;outline-color:var(--blue)}
.send{background:var(--blue);color:white;border-radius:7px;padding:0 18px}
.comment{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid #f0f1f2}
.comment .author-avatar{width:34px;height:34px;font-size:16px}
.comment-body{flex:1}
.comment-name{font-size:12px;color:#888}
.comment-text{margin-top:4px}
.empty{color:#9aa0a6;text-align:center;padding:24px 0}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.show{opacity:1}
.footer{text-align:center;color:#9aa0a6;padding:30px 10px;font-size:12px}
@media(max-width:1050px){
.nav{display:none}
.layout{grid-template-columns:minmax(0,1fr) 300px}
.topbar{gap:15px}
.search{width:min(360px,45vw)}
}
@media(max-width:760px){
.topbar{height:56px;padding:0 13px;gap:12px}
.top-action{display:none}
.search{width:auto;flex:1}
.layout{display:block;margin:14px auto;padding:0 10px}
.sidebar{margin-top:20px}
.video-title{font-size:19px}
.below-player{gap:10px;flex-wrap:wrap}
.below-player .watch{width:100%}
.action{font-size:13px}
.video-card{grid-template-columns:135px 1fr}
.side-author{display:none}
.playlist-head{margin-top:0}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="logo">bilibili</div>
  <nav class="nav">
    <a href="#">首页⌄</a><a href="#">番剧</a><a href="#">直播</a>
    <a href="#">游戏中心</a><a href="#">会员购</a><a href="#">漫画</a><a href="#">赛事</a>
  </nav>
  <form class="search" id="searchForm">
    <input id="searchInput" placeholder="搜索视频、作者或关键词">
    <button aria-label="搜索">⌕</button>
  </form>
  <div class="avatar">🌸</div>
  <div class="top-action">大会员</div>
  <div class="top-action">消息</div>
  <div class="top-action">动态</div>
  <div class="top-action">收藏</div>
  <button class="upload" id="addVideo">＋ 添加视频</button>
</header>

<div class="layout">
<main class="main">
  <h1 class="video-title" id="videoTitle">示例视频：在这里放入你自己的外链视频</h1>

  <div class="meta">
    <span>▣ <span id="views">3.2万</span> 次观看</span>
    <span>▤ <span id="danmakuCount">128</span> 条弹幕</span>
    <span id="publishDate">2026-11-03 20:00:00</span>
    <span>◉ 未经作者授权，禁止转载</span>
  </div>

  <div class="player" id="player">
    <video id="video" playsinline preload="metadata" crossorigin="anonymous"></video>
    <div class="poster-layer" id="posterLayer" title="播放"></div>
    <div class="danmaku-layer" id="danmakuLayer"></div>

    <div class="controls" id="controls">
      <div class="progress-wrap" id="progressWrap">
        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="control-row">
        <button class="ctrl" id="playBtn" title="播放/暂停">▶</button>
        <span class="time" id="time">00:00 / 00:00</span>
        <button class="ctrl" id="muteBtn" title="静音">🔊</button>
        <input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".8">
        <span class="control-spacer"></span>
        <select class="speed" id="speed" aria-label="播放速度">
          <option value=".5">0.5x</option>
          <option value=".75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
        <button class="ctrl" id="pipBtn" title="画中画">▣</button>
        <button class="ctrl" id="wideBtn" title="宽屏">▱</button>
        <button class="ctrl" id="fullBtn" title="全屏">⛶</button>
      </div>
    </div>
  </div>

  <div class="below-player">
    <span class="watch">1人正在看</span>
    <button class="action" data-action="like">👍 <strong id="likeCount">108</strong></button>
    <button class="action" data-action="coin">🪙 <strong id="coinCount">8</strong></button>
    <button class="action" data-action="favorite">★ <strong id="favoriteCount">97</strong></button>
    <button class="action" data-action="share">↗ <strong id="shareCount">68</strong></button>
    <button class="action" id="captureBtn">▧ 截取封面</button>
  </div>

  <section class="section">
    <div class="author-line">
      <div class="author-avatar" id="authorAvatar">🌸</div>
      <div class="author-info">
        <div class="author-name" id="authorName">示例作者</div>
        <div class="sub" id="authorFans">个人创作者 · 欢迎来到我的空间</div>
      </div>
      <button class="follow" id="followBtn">＋ 关注</button>
    </div>
    <div class="desc" id="description"></div>
    <div id="tags"></div>
  </section>

  <section class="section comments">
    <h3>评论 <span class="sub" id="commentCount">0</span></h3>
    <form class="comment-input" id="commentForm">
      <input id="commentInput" placeholder="发一条友善的评论吧…" maxlength="300">
      <button class="send">发布</button>
    </form>
    <div id="comments">
      <div class="empty">还没有评论，来抢沙发吧！</div>
    </div>
  </section>
</main>

<aside class="sidebar">
  <div class="side-author">
    <div class="avatar">🌸</div>
    <div>
      <b id="sideAuthor">Tsugumirin</b>
      <div class="sub">个人空间</div>
    </div>
    <button class="follow" id="sideFollow">＋ 关注</button>
  </div>

  <div class="playlist-head">播放列表　⋮ <span style="float:right;color:#888">⌄</span></div>
  <div class="video-list" id="videoList"></div>
</aside>
</div>

<div class="footer">临时测试页面</div>
<div class="toast" id="toast"></div>

<script>
/*
 * 视频配置：
 * url：MP4 / WebM 视频直链
 * cover：封面图片 URL，可以留空
 * HLS(m3u8) 需要额外引入 hls.js
 */

const videos = [
  {
    title:"【司凤版】西中校歌",
    url:"https://pub-f9a063dcedde4948a4c413043c2e8f9c.r2.dev/video.mp4",
    cover:"https://tse1.mm.bing.net/th/id/OIP.NZOdDr73L90LFDCs0E3y1wHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3",
    author:"Tsugumirin",
    avatar:"🍥",
    date:"2026-11-04 13:50:33",
    views:"-",
    danmaku:128,
    duration:"-",
    description:"这是一个 B 站风格静态播放器示例。\n\n编辑 index.html 顶部 script 中的 videos 数组，即可添加自己的外链视频、标题、作者、简介和封面。视频地址需要是浏览器能够直接访问的媒体文件链接。",
    tags:["演示","静态网页","视频播放器"]
  },
  
];

let current=0;
let wide=false;
let followed=false;
let comments=[];

const $=id=>document.getElementById(id);
const video=$("video");

const fmt=t=>{
  if(!Number.isFinite(t))return"00:00";
  let m=Math.floor(t/60),s=Math.floor(t%60);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
};

function toast(msg){
  const el=$("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.classList.remove("show"),1900);
}

function renderList(filter=""){
  const list=$("videoList");
  list.innerHTML="";

  videos.forEach((v,i)=>{
    if(filter&&!(`${v.title} ${v.author} ${v.description}`.toLowerCase().includes(filter.toLowerCase())))return;

    const card=document.createElement("div");
    card.className="video-card"+(i===current?" selected":"");

    card.innerHTML=`
      <div class="thumb" style="background-image:url('${v.cover||""}')">
        <span class="duration">${v.duration||"--:--"}</span>
      </div>
      <div>
        <div class="vtitle"></div>
        <div class="vmeta">${v.author}<br>▣ ${v.views||"—"}　▤ ${v.danmaku||0}</div>
      </div>
    `;

    card.querySelector(".vtitle").textContent=v.title;
    card.addEventListener("click",()=>loadVideo(i));
    list.appendChild(card);
  });

  if(!list.children.length){
    list.innerHTML='<div class="empty">没有找到相关视频</div>';
  }
}

function loadVideo(i){
  current=i;
  const v=videos[i];

  video.pause();
  video.src=v.url;
  video.load();

  $("videoTitle").textContent=v.title;
  $("views").textContent=v.views||"—";
  $("danmakuCount").textContent=v.danmaku||0;
  $("publishDate").textContent=v.date||"";

  $("authorName").textContent=v.author;
  $("sideAuthor").textContent=v.author;
  $("authorAvatar").textContent=v.avatar||"●";
  $("description").textContent=v.description||"暂无简介";

  $("tags").innerHTML=(v.tags||[])
    .map(t=>`<span class="tag"></span>`).join("");

  [...$("tags").children].forEach((el,j)=>{
    el.textContent=v.tags[j];
  });

  $("posterLayer").style.backgroundImage=
    v.cover?`url("${v.cover}")`:"none";

  $("posterLayer").classList.remove("hidden");
  $("playBtn").textContent="▶";
  $("progressFill").style.width="0%";
  $("time").textContent="00:00 / 00:00";

  document.querySelectorAll("[data-action]").forEach(b=>{
    b.classList.remove("active");
    const key=b.dataset.action;
    const count={
      like:108,
      coin:8,
      favorite:97,
      share:68
    }[key];
    $(key+"Count").textContent=count;
  });

  followed=false;
  $("followBtn").textContent="＋ 关注";
  $("sideFollow").textContent="＋ 关注";

  renderList($("searchInput").value.trim());
}

$("posterLayer").onclick=()=>{
  video.play().catch(()=>toast("视频无法播放，请检查外链地址"));
};

$("playBtn").onclick=()=>{
  video.paused?video.play():video.pause();
};

video.addEventListener("play",()=>{
  $("posterLayer").classList.add("hidden");
  $("playBtn").textContent="Ⅱ";
});

video.addEventListener("pause",()=>{
  $("playBtn").textContent="▶";
});

video.addEventListener("timeupdate",()=>{
  if(video.duration){
    $("progressFill").style.width=
      (video.currentTime/video.duration*100)+"%";
    $("time").textContent=
      fmt(video.currentTime)+" / "+fmt(video.duration);
  }
});

video.addEventListener("loadedmetadata",()=>{
  $("time").textContent="00:00 / "+fmt(video.duration);

  if(!videos[current].duration||videos[current].duration==="--:--"){
    videos[current].duration=fmt(video.duration);
  }

  renderList($("searchInput").value.trim());
});

video.addEventListener("ended",()=>{
  if(current<videos.length-1){
    loadVideo(current+1);
  }
});

$("progressWrap").onclick=e=>{
  if(!video.duration)return;

  const r=e.currentTarget.getBoundingClientRect();

  video.currentTime=
    Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))
    *video.duration;
};

$("volume").oninput=e=>{
  video.volume=+e.target.value;
  video.muted=false;
  $("muteBtn").textContent=video.volume===0?"🔇":"🔊";
};

$("muteBtn").onclick=()=>{
  video.muted=!video.muted;
  $("muteBtn").textContent=video.muted?"🔇":"🔊";
};

$("speed").onchange=e=>{
  video.playbackRate=+e.target.value;
};

$("fullBtn").onclick=()=>{
  if(!document.fullscreenElement){
    $("player").requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
};

$("wideBtn").onclick=()=>{
  wide=!wide;

  $("player").style.position=wide?"fixed":"relative";
  $("player").style.inset=wide?"64px 0 0":"auto";
  $("player").style.zIndex=wide?"30":"auto";
  $("player").style.width=wide?"100vw":"100%";
  $("player").style.height=wide?"calc(100vh - 64px)":"auto";
  $("player").style.aspectRatio=wide?"auto":"16/9";

  toast(wide?"已切换宽屏模式":"已退出宽屏模式");
};

$("pipBtn").onclick=async()=>{
  try{
    if(document.pictureInPictureElement){
      await document.exitPictureInPicture();
    }else{
      await video.requestPictureInPicture();
    }
  }catch(e){
    toast("当前浏览器不支持画中画");
  }
};

document.querySelectorAll("[data-action]").forEach(btn=>{
  btn.onclick=()=>{
    const key=btn.dataset.action;
    const el=$(key+"Count");

    if(key==="share"){
      el.textContent=+el.textContent+1;

      if(navigator.clipboard?.writeText){
        navigator.clipboard.writeText(location.href).catch(()=>{});
      }

      toast("已复制页面链接（演示）");
      return;
    }

    const active=btn.classList.toggle("active");
    el.textContent=+el.textContent+(active?1:-1);

    toast(active?({
      like:"点赞成功",
      coin:"投币成功",
      favorite:"已收藏"
    }[key]):"已取消");
  };
});

function toggleFollow(){
  followed=!followed;

  $("followBtn").textContent=followed?"✓ 已关注":"＋ 关注";
  $("sideFollow").textContent=followed?"✓ 已关注":"＋ 关注";

  toast(followed?"关注成功":"已取消关注");
}

$("followBtn").onclick=toggleFollow;
$("sideFollow").onclick=toggleFollow;

$("searchForm").onsubmit=e=>{
  e.preventDefault();
  renderList($("searchInput").value.trim());
};

$("searchInput").oninput=e=>{
  renderList(e.target.value.trim());
};

$("commentForm").onsubmit=e=>{
  e.preventDefault();

  const val=$("commentInput").value.trim();

  if(!val)return;

  comments.unshift(val);
  $("commentInput").value="";

  renderComments();
};

function renderComments(){
  $("commentCount").textContent=comments.length;
  $("comments").innerHTML="";

  if(!comments.length){
    $("comments").innerHTML=
      '<div class="empty">还没有评论，来抢沙发吧！</div>';
    return;
  }

  comments.forEach(t=>{
    const d=document.createElement("div");
    d.className="comment";

    d.innerHTML=`
      <div class="author-avatar">🙂</div>
      <div class="comment-body">
        <div class="comment-name">访客 · 刚刚</div>
        <div class="comment-text"></div>
      </div>
    `;

    d.querySelector(".comment-text").textContent=t;
    $("comments").appendChild(d);
  });
}

function captureCover(){
  if(video.readyState<2){
    toast("请先播放视频，等待画面加载");
    return;
  }

  try{
    const c=document.createElement("canvas");

    c.width=video.videoWidth;
    c.height=video.videoHeight;

    c.getContext("2d").drawImage(video,0,0);

    const url=c.toDataURL("image/jpeg",.88);

    videos[current].cover=url;
    $("posterLayer").style.backgroundImage=`url("${url}")`;

    renderList($("searchInput").value.trim());

    toast("已将当前画面设为封面（刷新后恢复）");
  }catch(e){
    toast("抓帧失败：视频外链可能未开放跨域权限，请手动填写 cover 图片地址");
  }
}

$("captureBtn").onclick=captureCover;

$("addVideo").onclick=()=>{
  const title=prompt("视频标题：");
  if(!title)return;

  const url=prompt("视频直链（MP4/WebM）：");
  if(!url)return;

  const author=prompt("作者：")||"访客";
  const cover=prompt("封面图片 URL（可留空，稍后抓帧）：")||"";

  videos.push({
    title,
    url,
    cover,
    author,
    avatar:"🎬",
    date:new Date().toLocaleString("zh-CN"),
    views:"0",
    danmaku:0,
    duration:"--:--",
    description:"",
    tags:["新添加"]
  });

  renderList();
  loadVideo(videos.length-1);

  toast("已添加到当前播放列表；刷新后恢复默认");
};

document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){
    return;
  }

  if(e.code==="Space"){
    e.preventDefault();
    video.paused?video.play():video.pause();
  }

  if(e.code==="ArrowRight"){
    video.currentTime=Math.min(video.duration||0,video.currentTime+5);
  }

  if(e.code==="ArrowLeft"){
    video.currentTime=Math.max(0,video.currentTime-5);
  }
});

loadVideo(0);
</script>
</body>
</html>
